name: Build Erosion 0.3.2b1

on:
  push:
    paths:
      - .github/workflows/build-erosion.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: jailbreakdotparty/Erosion
          ref: fb16225faa120d258ca5b8856568cf504199598f
          persist-credentials: false
          submodules: recursive

      - name: Install ldid
        run: brew install ldid

      - name: Build IPA
        run: bash ipabuild.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Erosion-0.3.2b1
          path: Erosion.ipa
          if-no-files-found: error
